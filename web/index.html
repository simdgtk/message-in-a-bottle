<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="preload" href="/fonts/cursive/cursive.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message in a bottle</title>
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" version="1.1">
    <defs>
      <filter id="erase" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04 0.12" numOctaves="2" seed="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="50" xChannelSelector="R" yChannelSelector="G" result="warped" />
        <feGaussianBlur in="warped" stdDeviation="6" />
      </filter>
    </defs>
  </svg>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
